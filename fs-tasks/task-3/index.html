<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Student Profile</h1>
        <form id="student-form" class="form" onsubmit="return false;">
            <label> Name:
                <input type="text" id="name" placeholder="e.g. Ravi Kumar" required>
            </label>
            <label> Roll Number:
                <input type="text" id="roll" placeholder="e.g. A23126552001" required>
            </label>
            <label> Department:
                <input type="text" id="dept" placeholder="e.g. CSE (AI & ML)" required>
            </label>
            <label> CGPA:
                <input type="number" step="0.01" id="cgpa" placeholder="e.g. 8.42" required>
            </label>
            <button id="create-btn" type="button">Create Profile</button>
        </form>
        <div id="profile-container"></div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
