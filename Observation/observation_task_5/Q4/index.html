<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation Demonstration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }

    /* Initial element style */
    .card {
      width: 320px;
      padding: 20px;
      border: 2px solid #ccc;
      background-color: #ffffff;
      border-radius: 8px;
      text-align: center;
      transition: all 0.3s ease;
    }

    button {
      margin-top: 20px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- HTML Element to modify via DOM -->
  <div id="productCard" class="card">
    <h3 id="cardTitle">Original Title</h3>
    <img id="cardImage" src="https://via.placeholder.com/150/0000FF/808080?text=Blue+Image" alt="Blue Image Placeholder" width="150">
    <p id="cardDescription">This is the original paragraph content.</p>
  </div>

  <button id="updateBtn">Update Element via DOM</button>

  <script>
    // 1. Select DOM Elements
    const cardTitle = document.getElementById('cardTitle');
    const cardDescription = document.getElementById('cardDescription');
    const cardImage = document.getElementById('cardImage');
    const productCard = document.getElementById('productCard');
    const updateBtn = document.getElementById('updateBtn');

    // 2. Add event listener to trigger dynamic changes
    updateBtn.addEventListener('click', function() {

      // A. DYNAMICALLY CHANGE CONTENT
      // textContent changes raw text; innerHTML supports embedded HTML elements
      cardTitle.textContent = "Updated Product Title";
      cardDescription.innerHTML = "This text was modified using <strong>JavaScript DOM properties</strong>!";

      // B. DYNAMICALLY CHANGE STYLES
      // Direct inline style manipulation
      productCard.style.backgroundColor = "#e8f8f5";
      productCard.style.borderColor = "#2ecc71";
      productCard.style.boxShadow = "0 8px 16px rgba(0, 0, 0, 0.15)";

      // C. DYNAMICALLY CHANGE ATTRIBUTES
      // setAttribute() updates element attributes like src, alt, href, or class
      cardImage.setAttribute('src', 'https://via.placeholder.com/150/FF0000/FFFFFF?text=Red+Image');
      cardImage.setAttribute('alt', 'Updated Red Image Placeholder');
    });
  </script>

</body>
</html>
