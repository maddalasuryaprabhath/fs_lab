<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product-Calculator</title>
    <!-- Css-linking -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="card">
        <h2>Product-Calculator</h2>
        <form id="productForm" onsubmit="event.preventDefault();">
            <!-- Product name -->
             <div class="form-group">
                <label for="productName">Product Name:</label>
                <input type="text" id="productName" name="productName" required placeholder="monitor">
            </div>

            <div class="form-group">
                <label for="productPrice">Unit Price ($)</label>
                <input 
                    type="number" 
                    id="productPrice" 
                    placeholder="Enter price" 
                    step="0.01" 
                    min="0"
                    value="25.00"
                >
                <div class="error-message" id="priceError">Please enter a valid positive price.</div>
            </div>

            <div class="form-group">
                <label for="productQuantity">Quantity</label>
                <input 
                    type="number" 
                    id="productQuantity" 
                    placeholder="Enter quantity" 
                    step="1" 
                    min="1"
                    value="1"
                >
                <div class="error-message" id="quantityError">Please enter a valid positive quantity (min 1).</div>
            </div>
        </form>

        <div class="result-container">
            <div class="summary-row">
                <span>Selected Product:</span>
                <span id="displayName" class="product-display-name">Wireless Mouse</span>
            </div>

            <div class="total-row">
                <span>Total Amount:</span>
                <span class="total-price" id="totalPrice">25.00</span>
            </div>
        
        </div>
    </div>
        </form>
    </div>
</body>
</html>
